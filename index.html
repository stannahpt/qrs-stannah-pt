
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>QR's Stannah PT</title>

  <meta name="description" content="Acesso rápido às ferramentas de trabalho Stannah PT">
  <meta name="theme-color" content="#173653">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="QR's Stannah">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2f6;
      color: #173653;
      min-height: 100vh;
    }

    header {
      background: #173653;
      color: white;
      text-align: center;
      padding: 27px 15px;
      padding-top: calc(27px + env(safe-area-inset-top));
      box-shadow: 0 3px 10px #0002;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: .5px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 13px;
      color: #cbd9e6;
    }

    main {
      max-width: 520px;
      margin: auto;
      padding: 22px 18px;
      min-height: 65vh;
    }

    h2 {
      font-size: 21px;
      margin: 10px 0 20px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 19px;
      background: white;
      color: #173653;
      font-size: 16px;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 3px 12px #17365312;
      transition: transform .12s, background .12s;
    }

    button:active {
      transform: scale(.98);
      background: #e5edf5;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .icon {
      font-size: 25px;
      min-width: 30px;
    }

    .arrow {
      margin-left: auto;
      color: #66829c;
      font-size: 23px;
    }

    .back {
      background: #dce6ef;
      padding: 13px 16px;
      margin-bottom: 20px;
      font-size: 14px;
      box-shadow: none;
    }

    .coming {
      text-align: center;
      padding: 45px 15px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 12px #17365312;
    }

    .coming div {
      font-size: 48px;
    }

    .coming h3 {
      margin: 15px 0 8px;
    }

    .coming p {
      color: #718096;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #8090a0;
      font-size: 12px;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }
  </style>
</head>

<body>

<header>
  <h1>QR's Stannah PT</h1>
  <p>WORK HUB · Acesso rápido</p>
</header>

<main>
  <div id="app"></div>
</main>

<footer>
  Stannah PT · WORK HUB
</footer>

<script>
"use strict";

const sections = {
  "EDE's": [
    {
      name: "600",
      url: "https://forms.monday.com/forms/cfd34aceb60ab1a6a0251b3dda46ea56?r=use1&s=qr"
    },
    {
      name: "260",
      url: "https://forms.monday.com/forms/054c1662605f082e96b8a37c9372bac9?r=use1&s=qr"
    },
    {
      name: "158",
      url: "https://forms.monday.com/forms/ec03982decf0a5a36a3fc11376e79015?r=use1&s=qr"
    },
    {
      name: "320",
      url: "https://forms.monday.com/forms/5e70e245a9abf37997d5d46a508490dc?r=use1&s=qr"
    },
    {
      name: "Curved outdoor",
      url: "https://forms.monday.com/forms/66b235d5846dd03cba5af371dbb1d0c7?r=use1&s=qr"
    }
  ],

  "UPlifts": [
    {
      name: "Pedidos de garantia",
      url: "https://forms.monday.com/forms/81cef5650377776c1eaaee351abf3949?r=use1"
    },
    {
      name: "Comissionamento",
      url: "https://forms.monday.com/forms/45cb5b7baab059e95473f05c07c9cbd4?r=use1&s=qr"
    },
    {
      name: "Final Safety Checks",
      url: "https://forms.monday.com/forms/643436a4402d7aa2a774c5e48ebb621d?r=use1&s=qr"
    }
  ]
};

const app = document.getElementById("app");

function home() {
  app.innerHTML = `
    <h2>Menu principal</h2>

    <div class="menu">

      <button onclick="showSection('EDEs')">
        <span class="item">
          <span class="icon">📋</span>
          EDE's
          <span class="arrow">›</span>
        </span>
      </button>

      <button onclick="showSection('UPlifts')">
        <span class="item">
          <span class="icon">🛠️</span>
          UPlifts
          <span class="arrow">›</span>
        </span>
      </button>

      <button onclick="showSection('Extrema')">
        <span class="item">
          <span class="icon">💻</span>
          Extrema
          <span class="arrow">›</span>
        </span>
      </button>

    </div>
  `;
}

function showSection(name) {

  if (name === "EDEs") {
    name = "EDE's";
  }

  if (name === "Extrema") {

    app.innerHTML = `
      <button class="back" onclick="home()">
        ← Menu principal
      </button>

      <h2>Extrema</h2>

      <div class="coming">
        <div>🚧</div>
        <h3>Disponível brevemente!</h3>
        <p>Estamos a preparar esta secção.</p>
      </div>
    `;

    return;
  }

  const items = sections[name];

  if (!items) {
    home();
    return;
  }

  app.innerHTML = `
    <button class="back" onclick="home()">
      ← Menu principal
    </button>

    <h2>${name}</h2>

    <div class="menu">

      ${items.map((item, index) => `
        <button data-section="${name}" data-index="${index}">
          <span class="item">
            <span class="icon">📄</span>
            ${item.name}
            <span class="arrow">↗</span>
          </span>
        </button>
      `).join("")}

    </div>
  `;

  app.querySelectorAll("[data-index]").forEach(button => {
    button.addEventListener("click", () => {
      const section = button.dataset.section;
      const index = Number(button.dataset.index);
      openLink(sections[section][index].url);
    });
  });
}

function openLink(url) {
  window.location.href = url;
}

// Regresso ao menu principal com o botão voltar do Android
history.replaceState({ page: "home" }, "", location.href);

function navigateHome() {
  home();
}

window.addEventListener("popstate", () => {
  home();
});

// Registo do Service Worker
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", {
      scope: "./"
    }).catch(error => {
      console.error("Erro no Service Worker:", error);
    });
  });
}

home();
</script>

</body>
</html>
